<header class="site-header">
  <nav class="nav-container">
    <a href="/" class="nav-brand">{{ .Site.Title }}</a>
    <button class="nav-search-btn" type="button" aria-label="Search blog posts" aria-haspopup="dialog" data-search-open>
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11.742 10.344a6.5 6.5 0 10-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 001.415-1.414l-3.85-3.85a1 1 0 00-.115-.1zM12 6.5a5.5 5.5 0 11-11 0 5.5 5.5 0 0111 0z"/></svg>
      <span class="nav-search-label">Search</span>
      <kbd class="nav-search-kbd" aria-hidden="true"><span data-search-mod>⌘</span>K</kbd>
    </button>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}"{{ with .Params.external }} target="_blank" rel="noopener"{{ end }}>
          {{ .Name }}
          {{ with .Params.external }}<svg class="icon-external" viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M3.75 2h3.5a.75.75 0 010 1.5H4.5v8h8V8.75a.75.75 0 011.5 0v3.5A1.75 1.75 0 0112.25 14h-8.5A1.75 1.75 0 012 12.25v-8.5C2 2.784 2.784 2 3.75 2zm6.5 0h3a.75.75 0 01.75.75v3a.75.75 0 01-1.5 0V4.06L8.28 8.28a.75.75 0 01-1.06-1.06L11.44 3.5H9.75a.75.75 0 010-1.5h.5z"/></svg>{{ end }}
        </a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
