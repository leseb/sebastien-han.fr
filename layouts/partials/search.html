{{- $count := len (where .Site.RegularPages "Section" "blog") -}}
<div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-label="Search blog posts" hidden>
  <div class="search-backdrop" data-search-close></div>
  <div class="search-panel">
    <div class="search-input-row">
      <svg class="search-input-icon" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11.742 10.344a6.5 6.5 0 10-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 001.415-1.414l-3.85-3.85a1 1 0 00-.115-.1zM12 6.5a5.5 5.5 0 11-11 0 5.5 5.5 0 0111 0z"/></svg>
      <input type="search" id="searchInput" class="search-input" placeholder="Search {{ $count }} blog posts…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list">
      <button type="button" class="search-close-btn" data-search-close aria-label="Close search"><kbd>Esc</kbd></button>
    </div>
    <ul class="search-results" id="searchResults" role="listbox" aria-label="Search results"></ul>
    <div class="search-status" id="searchStatus" aria-live="polite">Start typing to search {{ $count }} posts.</div>
  </div>
</div>
