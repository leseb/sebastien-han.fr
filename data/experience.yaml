skills:
  - name: Praxis
    group: now
    span: 3
    repo: praxis-proxy/praxis
    color: "oklch(0.72 0.17 250)"
    icon: praxis.svg
    link: https://praxis.fast/
    description: |
      Maintainer of Praxis Core and Praxis AI. Building a programmable proxy framework
      in Rust and an AI gateway for model and agent traffic, with provider-aware routing,
      protocol translation, and composable request pipelines.

  - name: Rook
    group: foundations
    span: 2
    repo: rook/rook
    color: "oklch(0.72 0.13 230)"
    icon: rook.svg
    link: https://rook.io/
    description: |
      Maintainer Emeritus after several years maintaining Rook, a CNCF graduated project.
      Helped bring Ceph storage to Kubernetes through automated deployment,
      scaling, upgrades, and recovery.

  - name: OGX
    group: now
    span: 3
    repo: ogx-ai/ogx
    color: "oklch(0.78 0.14 175)"
    icon: ogx.png
    link: https://ogx-ai.github.io/
    description: |
      Core maintainer of OGX (Open GenAI Stack), a composable platform for building LLM applications.
      OpenAI-compatible Responses API, multi-provider inference, vector storage, auth, and more.
      8,000+ stars, multi-language SDKs, Kubernetes operator.

  - name: AI/ML Infrastructure
    group: now
    span: 6
    repo: instructlab/instructlab
    color: "oklch(0.75 0.15 300)"
    icon: ai.svg
    link: https://instructlab.ai/
    description: |
      Building production AI infrastructure: LLM serving, agentic APIs, inference gateways.
      Contributor to InstructLab and Kubeflow. Deep expertise in model serving,
      synthetic data generation, and evaluation pipelines.

  - name: Kubernetes
    group: foundations
    span: 2
    color: "oklch(0.65 0.16 260)"
    icon: kubernetes.png
    link: https://github.com/rook/rook
    description: |
      Working with Kubernetes since 2016. Built the OGX Kubernetes operator for deploying
      AI stacks. Integrated Ceph storage into Kubernetes through Rook.

  - name: Open Source
    group: always
    span: 3
    color: "oklch(0.78 0.15 140)"
    icon: opensource.png
    description: |
      Lifelong Open Source advocate, running Linux since 2008. From storage to AI,
      always building in the open. Hundreds of upstream contributions across
      Praxis, OGX, InstructLab, Kubeflow, Rook, and Ceph.

  - name: Ceph & Storage
    group: foundations
    span: 2
    repo: ceph/ceph
    color: "oklch(0.68 0.19 25)"
    icon: ceph.png
    link: https://ceph.io/en/
    description: |
      A decade with Ceph (2012-2023). Created ceph-ansible and ceph-container.
      Built reference architectures for OpenStack + Ceph. Foundation that led to
      Kubernetes storage orchestration with Rook.

  - name: Public Speaking
    group: always
    span: 3
    color: "oklch(0.78 0.14 75)"
    icon: speaking.svg
    description: |
      Conferences worldwide: KubeCon, OpenStack Summit, CephDays, FOSDEM, DevOps D-Day.
      Presentations, workshops, and panel discussions on storage, cloud-native, and AI.

  - name: Publications
    icon: writing.svg
    description: |
      Technical blog since 2011. 370+ posts covering Ceph, OpenStack, Containers,
      Kubernetes, and AI/ML infrastructure.

